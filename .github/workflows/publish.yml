name: Publish npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Checkout the triggering tag's exact commit, never the current main tip.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify stable release tag and manifests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(process.env.GITHUB_EVENT_NAME, 'push', 'Release requires a tag push');
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag', 'Release requires a tag');
          assert.equal(typeof pkg.version, 'string');
          assert.match(pkg.version, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?![\s\S])/, 'Only stable x.y.z versions are supported');
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`, 'Tag must exactly match package version');
          assert.equal(lock.version, pkg.version, 'Lockfile version mismatch');
          assert.equal(lock.packages?.['']?.version, pkg.version, 'Lockfile root version mismatch');
          assert.equal(lock.name, pkg.name, 'Lockfile name mismatch');
          assert.equal(lock.packages?.['']?.name, pkg.name, 'Lockfile root name mismatch');
          NODE
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run validate
      - run: npm audit --audit-level=moderate
      - run: npm run pack:check
      - name: Publish through npm Trusted Publishing
        shell: bash
        run: |
          npm --version
          set +e
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN NPM_CONFIG_USERCONFIG=/dev/null npm publish --access public --provenance --loglevel=verbose > "$RUNNER_TEMP/npm-publish.log" 2>&1
          result=$?
          # Only print authentication diagnostics and publication status, not raw HTTP logs.
          grep -E '^npm (verbose oidc|error (code|need auth)|notice (Publishing|publish))|^\+ ' "$RUNNER_TEMP/npm-publish.log" | sed -E 's/npm_[A-Za-z0-9]+/[REDACTED]/g; s/eyJ[A-Za-z0-9_.-]+/[REDACTED]/g' || true
          # Emit only E422 error lines, never the verbose HTTP log. Redact URL
          # credentials/query/fragment data and common credential formats first.
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const log = readFileSync(`${process.env.RUNNER_TEMP}/npm-publish.log`, 'utf8');
          for (const line of log.split('\n')) {
            if (!/^npm error (?:422|E422)\b/.test(line)) continue;
            const safe = line
              .replace(/https?:\/\/[^\s<>"']+/g, value => {
                try {
                  const url = new URL(value);
                  return `${url.protocol}//${url.host}${url.pathname}`;
                } catch { return '[REDACTED URL]'; }
              })
              .replace(/npm_[A-Za-z0-9]+|eyJ[A-Za-z0-9_.-]+/g, '[REDACTED]')
              .replace(/(authorization|token|password|secret)\s*[:=]\s*\S+/gi, '$1=[REDACTED]')
              .replace(/Bearer\s+\S+/gi, 'Bearer [REDACTED]');
            console.log(safe);
          }
          NODE
          exit "$result"
